<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot Question Answerer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── API-key dialog ────────────────────────────────────────── */
    #api-key-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #api-key-overlay.hidden {
      display: none;
    }

    #api-key-dialog {
      background: #222;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 2rem;
      width: min(90vw, 420px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #api-key-dialog h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    #api-key-dialog p {
      font-size: 0.9rem;
      color: #aaa;
      line-height: 1.5;
    }

    #api-key-input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #555;
      background: #333;
      color: #fff;
      font-size: 1rem;
    }

    #api-key-input:focus {
      outline: none;
      border-color: #888;
    }

    /* ── Shared button style ───────────────────────────────────── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.65rem 1.4rem;
      transition: opacity 0.15s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button:not(:disabled):hover {
      opacity: 0.85;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-ok {
      background: #16a34a;
      color: #fff;
      font-size: 1.2rem;
      padding: 0.75rem 2.5rem;
    }

    /* ── Main camera view ──────────────────────────────────────── */
    #main-view {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
    }

    #main-view.hidden {
      display: none;
    }

    #camera-wrapper {
      position: relative;
      width: min(100vw, 100%);
      flex: 1 1 auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 4px;
    }

    #answer-btn {
      flex-shrink: 0;
      background: #dc2626;
      color: #fff;
      font-size: 1.4rem;
      padding: 0.8rem 3rem;
      border-radius: 50px;
      margin-bottom: 1rem;
    }

    /* ── Loading spinner overlay ───────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 200;
    }

    #loading-overlay.hidden {
      display: none;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 5px solid #555;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Answer dialog ─────────────────────────────────────────── */
    #answer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 1.5rem;
    }

    #answer-overlay.hidden {
      display: none;
    }

    #answer-dialog {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 14px;
      padding: 2rem;
      width: min(95vw, 680px);
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    #answer-dialog h2 {
      font-size: 1.3rem;
    }

    #answer-text {
      flex: 1;
      overflow-y: auto;
      font-size: 1.15rem;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #e5e5e5;
    }

    #answer-dialog .actions {
      display: flex;
      justify-content: flex-end;
    }

    /* ── Error message ─────────────────────────────────────────── */
    #error-msg {
      color: #f87171;
      font-size: 0.9rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <!-- 1. API-key entry dialog -->
  <div id="api-key-overlay">
    <div id="api-key-dialog">
      <h2>Screenshot Question Answerer</h2>
      <p>
        Enter your <a href="https://console.anthropic.com/" target="_blank" style="color:#60a5fa">Anthropic API key</a>
        to get started. The key is stored only in your browser session and is never sent anywhere except directly to
        Anthropic's API.
      </p>
      <input
        id="api-key-input"
        type="password"
        placeholder="sk-ant-…"
        autocomplete="off"
        spellcheck="false"
      />
      <div id="error-msg"></div>
      <button id="api-key-confirm" class="btn-primary">Start Camera</button>
    </div>
  </div>

  <!-- 2. Main camera view -->
  <div id="main-view" class="hidden">
    <div id="camera-wrapper">
      <video id="camera" autoplay playsinline muted></video>
    </div>
    <button id="answer-btn">Answer!</button>
  </div>

  <!-- 3. Loading overlay -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <p>Analyzing image…</p>
  </div>

  <!-- 4. Answer dialog -->
  <div id="answer-overlay" class="hidden">
    <div id="answer-dialog">
      <h2>Answer</h2>
      <div id="answer-text"></div>
      <div class="actions">
        <button id="ok-btn" class="btn-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Hidden canvas used for frame capture -->
  <canvas id="capture-canvas" style="display:none"></canvas>

  <script>
    // ── Element references ──────────────────────────────────────
    const apiKeyOverlay   = document.getElementById('api-key-overlay');
    const apiKeyInput     = document.getElementById('api-key-input');
    const apiKeyConfirm   = document.getElementById('api-key-confirm');
    const errorMsg        = document.getElementById('error-msg');

    const mainView        = document.getElementById('main-view');
    const cameraEl        = document.getElementById('camera');
    const answerBtn       = document.getElementById('answer-btn');

    const loadingOverlay  = document.getElementById('loading-overlay');

    const answerOverlay   = document.getElementById('answer-overlay');
    const answerText      = document.getElementById('answer-text');
    const okBtn           = document.getElementById('ok-btn');

    const captureCanvas   = document.getElementById('capture-canvas');

    // ── State ───────────────────────────────────────────────────
    let anthropicApiKey = '';
    let cameraStream    = null;

    // ── Helper: show/hide ───────────────────────────────────────
    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden');    }

    // ── Step 1: Confirm API key and start camera ────────────────
    apiKeyConfirm.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        errorMsg.textContent = 'Please enter your Anthropic API key.';
        return;
      }
      errorMsg.textContent = '';
      apiKeyConfirm.disabled = true;

      // Camera requires a secure context (HTTPS or localhost) on most mobile browsers.
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        apiKeyConfirm.disabled = false;
        errorMsg.textContent =
          'Camera not available. Please open this page over HTTPS (e.g. host it on a web server with TLS).';
        return;
      }

      // Try rear-facing camera first, then fall back to any camera.
      const constraints = [
        { video: { facingMode: { ideal: 'environment' } }, audio: false },
        { video: true, audio: false }
      ];

      let lastErr = null;
      for (const constraint of constraints) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia(constraint);
          break;
        } catch (err) {
          lastErr = err;
        }
      }

      if (lastErr) {
        apiKeyConfirm.disabled = false;
        const isPermission =
          lastErr.name === 'NotAllowedError' || lastErr.name === 'PermissionDeniedError';
        errorMsg.textContent = isPermission
          ? 'Camera access was denied. On mobile, make sure the page is served over HTTPS and that you allow camera permission in your browser settings.'
          : 'Could not access camera: ' + lastErr.message;
        return;
      }

      anthropicApiKey = key;
      cameraEl.srcObject = cameraStream;

      hide(apiKeyOverlay);
      show(mainView);
    });

    // Allow pressing Enter in the key field
    apiKeyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') apiKeyConfirm.click();
    });

    // ── Step 2: Capture frame and call Claude ───────────────────
    answerBtn.addEventListener('click', async () => {
      // Capture current video frame to canvas
      const video  = cameraEl;
      const width  = video.videoWidth;
      const height = video.videoHeight;
      captureCanvas.width  = width;
      captureCanvas.height = height;
      captureCanvas.getContext('2d').drawImage(video, 0, 0, width, height);

      // Convert to base64 JPEG (smaller than PNG for photos)
      const dataUrl  = captureCanvas.toDataURL('image/jpeg', 0.92);
      const base64   = dataUrl.split(',')[1];

      show(loadingOverlay);
      answerBtn.disabled = true;

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key':         anthropicApiKey,
            'anthropic-version': '2023-06-01',
            'content-type':      'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model:      'claude-3-5-sonnet-20241022',
            max_tokens: 1024,
            messages: [{
              role:    'user',
              content: [
                {
                  type: 'text',
                  text: 'Rephrase the question in the image and options if given. Answer the question two lines below behind \'Answer:\'. Keep your answer concise and to the point. Do not mention the image.'
                },
                {
                  type:   'image',
                  source: {
                    type:       'base64',
                    media_type: 'image/jpeg',
                    data:       base64
                  }
                }
              ]
            }]
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err?.error?.message || `HTTP ${response.status}`);
        }

        const data   = await response.json();
        const answer = data.content?.[0]?.text ?? '(No answer returned)';

        hide(loadingOverlay);
        answerText.textContent = answer;
        show(answerOverlay);
      } catch (err) {
        hide(loadingOverlay);
        answerText.textContent = 'Error: ' + err.message;
        show(answerOverlay);
      } finally {
        answerBtn.disabled = false;
      }
    });

    // ── Step 3: Dismiss answer and return to camera ─────────────
    okBtn.addEventListener('click', () => {
      hide(answerOverlay);
    });
  </script>
</body>
</html>
